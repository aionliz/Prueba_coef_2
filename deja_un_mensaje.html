<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración del documento y referencia al archivo CSS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deja un mensaje</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Encabezado con nombre del sitio y navegación principal -->
    <header>
        <div class="top1">
            <a href="index.html">
                Mi_Espacio
            </a>
        </div>
        <!-- Menú superior con enlaces a las distintas páginas -->
        <div class="top2">
            <a href="index.html">Inicio</a>
            <a href="hitos_de_mi_camino.html">Mi historia</a>
            <a href="deja_un_mensaje.html">forumulario</a>
            <a href="hacia_donde_quiero_llegar.html">Mis sueños</a>
        </div>
    </header>
    
    <!-- Cuerpo principal con la introducción y el formulario -->
    <main>
        <div class="contenido">
            <h6 class="somethingXd">
                 // Bienvenido
            </h6>
            <br>
            <br>
            <h1>
                Dejame un mensaje.
            </h1>
            <br>
            <p>
                Este formulario es solo práctica; no envía ningún servidor. Sirve
                para ejercitar etiquetas semánticas de formulario HTML.
            </p>
            <br>
            <br>
        </div>

        <!-- Formulario para escribir un nombre, correo y mensaje de prueba -->
        <form>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre">
            <br>
            <br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br>
            <br>
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje"></textarea>
            <br>
            <br>
            <input type="submit" value="Enviar">
        </form>
    </main>

    <!-- Pie de página final -->
    <footer>
        <div class="bottom1">
            <p>
                © Mi_Espacio
            </p>
        </div>
        <div class="bottom2">
            <p>
                Hecho con html y css
            </p>
        </div>
    </footer>
</body>
</html>
