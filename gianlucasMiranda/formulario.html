<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav-top">
        <div class="titulo">MI_ESPACIO</div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="mi_historia.html">Mi historia</a>
            <a href="mis_suenos.html">Mis sueños</a>
            <a href="formulario.html" class="active">Formulario</a>
        </nav>
    </div>
    <header>
        <p class="p1">//Formulario</p>
        <h1>Dejame un mensaje</h1>
        <p>Este formulario es solo de consulta</p>
    </header>
    <main>
        <section class="form-container">
            <form>
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label>Correo electronico</label>
                    <input type="email" placeholder="tucorreo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label>Asunto</label>
                    <select>
                        <option>Opinion</option>
                        <option>Mejora</option>
                        <option>Otro</option>
                    </select>
                </div>
                <div class="form-group" id="dep-mensaje">
                    <label>Mensaje</label>
                    <textarea id="mensaje" placeholder="Escriba tu mensaje aqui..."></textarea>
                </div>
                <div class="form-group">
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p>2026 mi_espacio</p> 
        <p>hecho con HTML + CSS</p>
    </footer>
</body>
</html>
