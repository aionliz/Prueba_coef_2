<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mi Formulario</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- Encabezado -->
    <header>
        <h2>MI_ESPACIO</h2>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="mi_historia.html">Mi Historia</a>
            <a href="formulario.html">Formulario</a>
            <a href="mis_sueños.html">Mis Sueños</a>
        </nav>
    </header>

    <!-- Contenido -->
    <main>

        <p>CONTACTO</p>

        <h1>Déjame un mensaje</h1>

        <p>Este formulario es solo de práctica. No envía información.</p>

        <form>

            <div>
                <p>Nombre</p>
                <input type="text" placeholder="Tu nombre">
            </div>

            <div>
                <p>Correo electrónico</p>
                <input type="email" placeholder="tucorreo@ejemplo.com">
            </div>

            <div>
                <p>Asunto</p>

                <select>
                    <option>Solo quiero saludar</option>
                </select>
            </div>

            <div>
                <p>¿Cómo llegaste a este sitio?</p>

                <input type="radio" name="origen"> Redes sociales
                <input type="radio" name="origen"> Un amigo
                <input type="radio" name="origen"> Buscador
            </div>

            <div>
                <p>Mensaje</p>

                <textarea rows="4" placeholder="Escribe aquí tu mensaje"></textarea>
            </div>

            <button>ENVIAR</button>

        </form>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>© Hecho por Manuel Ibañez</p>
        <p>Hecho con HTML y CSS</p>
    </footer>

</body>
</html>
