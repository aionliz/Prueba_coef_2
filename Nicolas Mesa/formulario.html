<main>
<section>
<article>
<!-- Aquí va tu contenido -->
<h4>// Contacto</h4>
<form>
    <div>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
    </div>
    <div>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    </div>
    <div>
    <label for="mensaje">Asunto:</label>
    <select id="mensaje" name="Asunto" required>
        <option value="">Seleccione una opción</option>
        <option value="consulta">Consulta</option>
        <option value="sugerencia">Sugerencia</option>
        <option value="comentario">Comentario</option>
    </select>
    </div>
    <div>
        <label>Como llegaste a este sitio:</label>
        <input type="radio" id="busqueda" name="llegada" value="busqueda" required>
        <label for="busqueda">Búsqueda en Internet</label>
        <input type="radio" id="redes" name="llegada" value="redes" required>
        <label for="redes">Redes Sociales</label>
        <input type="radio" id="recomendacion" name="llegada" value="recomendacion" required>
        <label for="recomendacion">Recomendación de un amigo</label>
    </div>
    <div>
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
    </div>
    <button type="submit">Enviar</button>
</form>
</article>
</section>
